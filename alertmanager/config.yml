route:
  receiver: 'pagerduty'
  group_by: ['alertname']
  group_wait: 0s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'pagerduty'
    pagerduty_configs:
      - routing_key_file: /run/secrets/pagerduty_routing_key
        url: https://events.eu.pagerduty.com/v2/enqueue
        send_resolved: true
