apiVersion: 1
groups:
    - orgId: 1
      name: Alerting group
      folder: Shard events
      interval: 2m
      rules:
        - uid: f915a647-f598-4e63-98f5-cd076d2c5450
          title: Shard events
          condition: D
          data:
            - refId: Disconnects over 10m
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                exemplar: true
                expr: sum by (exported_instance) (rate(bot_shard_event{exported_instance=~"(prod-1|prod-2|prod-3|prod-4|prod-5|prod-6|prod-7|prod-8|prod-9|prod-10|prod-11|prod-12)", event="disconnected"}[$__rate_interval]) * 60)
                format: time_series
                instant: false
                interval: ""
                intervalFactor: 1
                intervalMs: 15000
                legendFormat: '{{exported_instance}} disconnect'
                maxDataPoints: 43200
                range: true
                refId: Disconnects over 10m
            - refId: D
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 4
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - D
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: Average
                intervalMs: 1000
                maxDataPoints: 43200
                refId: D
                type: threshold
            - refId: Average
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: Disconnects over 10m
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: mean
                refId: Average
                settings:
                    mode: dropNN
                type: reduce
          dashboardUid: fmbot-v2
          panelId: 59
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            __dashboardUid__: fmbot-v2
            __panelId__: "59"
            description: ""
            runbook_url: ""
            summary: Shard disconnects are occurring too frequently
          labels:
            "": ""
          isPaused: false
    - orgId: 1
      name: Liveness
      folder: Bot health
      interval: 1m
      rules:
        - uid: 7d3c8e2a-1f4b-4a5e-9c8d-3b2e4f5a6b7c
          title: NoCommandsProcessed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: sum(rate(bot_slash_commands_executed[5m])) + sum(rate(bot_commands_executed[5m]))
                instant: false
                interval: ""
                intervalMs: 15000
                legendFormat: commands/sec
                maxDataPoints: 43200
                range: true
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.0001
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 30m
          annotations:
            summary: fmbot has processed no commands for 30 minutes
            description: Combined rate of bot_slash_commands_executed and bot_commands_executed has been zero. Bot is likely down or unable to handle interactions.
          labels:
            severity: critical
            route: pagerduty
          isPaused: false
